name: Dependencies

on:
  workflow_call:
    outputs:
      lockhash:
        description: "Normalized package-lock.json hash"
        value: ${{ jobs.install.outputs.lockhash }}

jobs:
  install:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      lockhash: ${{ steps.lockhash.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Compute lockfile hash
        id: lockhash
        run: |
          node -e "const fs=require('fs');const crypto=require('crypto');const p='package-lock.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));delete j.version;const h=crypto.createHash('sha256').update(JSON.stringify(j)).digest('hex');fs.writeFileSync('.lockhash',h);"
          echo "hash=$(cat .lockhash)" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules
        id: node_modules_cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ steps.lockhash.outputs.hash }}
          restore-keys: |
            node_modules-${{ runner.os }}-

      - name: Check if package files changed meaningfully
        id: pkg_changed
        run: |
          git diff --name-only HEAD^ HEAD > /tmp/changed_files.txt || true
          CHANGED=false

          # Check package.json (ignore version-only changes)
          if grep -q '^package.json$' /tmp/changed_files.txt; then
            git show HEAD^:package.json > /tmp/prev_package.json || true
            PKG_CHANGED=$(node -e "const fs=require('fs');const prev=JSON.parse(fs.readFileSync('/tmp/prev_package.json','utf8')||'{}');const cur=JSON.parse(fs.readFileSync('package.json','utf8'));delete prev.version;delete cur.version;process.stdout.write(JSON.stringify(prev)!==JSON.stringify(cur) ? 'true' : 'false')")
            if [ "$PKG_CHANGED" = "true" ]; then CHANGED=true; fi
          fi

          # Check package-lock.json (ignore version-only changes)
          if grep -q '^package-lock.json$' /tmp/changed_files.txt; then
            git show HEAD^:package-lock.json > /tmp/prev_lock.json || true
            LOCK_CHANGED=$(node -e "const fs=require('fs');const prev=JSON.parse(fs.readFileSync('/tmp/prev_lock.json','utf8')||'{}');const cur=JSON.parse(fs.readFileSync('package-lock.json','utf8'));if(prev && cur){delete prev.version;delete cur.version;}process.stdout.write(JSON.stringify(prev)!==JSON.stringify(cur) ? 'true' : 'false')")
            if [ "$LOCK_CHANGED" = "true" ]; then CHANGED=true; fi
          fi

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Try download node_modules artifact (if cache missed & package unchanged)
        if: ${{ steps.node_modules_cache.outputs.cache-hit != 'true' && steps.pkg_changed.outputs.changed == 'false' }}
        uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: node_modules
        continue-on-error: true

      - name: Configure npm to skip git dep builds
        run: echo 'ignore-scripts=true' >> ~/.npmrc

      - name: Install dependencies (if needed)
        if: ${{ steps.node_modules_cache.outputs.cache-hit != 'true' }}
        run: |
          if [ -d node_modules ] && [ "$(ls -A node_modules)" ]; then
            echo "node_modules restored from artifact, skipping npm ci"
            exit 0
          fi
          echo "Running npm ci"
          git config --global credential.helper store
          echo "https://oauth2:${{ secrets.PAT_PRIVATE_DEPS }}@github.com" > ~/.git-credentials
          git config --global url."https://${{ secrets.PAT_PRIVATE_DEPS }}@github.com/".insteadOf "git@github.com:"
          npm ci

      - name: Verify dependencies installed
        run: |
          test -f node_modules/@polestar/constants/countries.js && echo "constants OK"
          test -f node_modules/@polestar/timed-usage/dist/index.js && echo "timed-usage OK"

      - name: Upload node_modules
        if: ${{ steps.node_modules_cache.outputs.cache-hit != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: node_modules
          path: node_modules
          retention-days: 1
