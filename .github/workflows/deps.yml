name: Dependencies

on:
  workflow_call:
    outputs:
      lockhash:
        description: "Normalized package-lock.json hash"
        value: ${{ jobs.install.outputs.lockhash }}

jobs:
  install:
    runs-on: ubuntu-latest
    outputs:
      lockhash: ${{ steps.lockhash.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Compute lockfile hash
        id: lockhash
        run: |
          node -e "const fs=require('fs');const crypto=require('crypto');const p='package-lock.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));delete j.version;const h=crypto.createHash('sha256').update(JSON.stringify(j)).digest('hex');fs.writeFileSync('.lockhash',h);"
          echo "hash=$(cat .lockhash)" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules
        id: node_modules_cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ steps.lockhash.outputs.hash }}
          restore-keys: |
            node_modules-${{ runner.os }}-

      - name: Configure npm to skip git dep builds
        run: echo 'ignore-scripts=true' >> ~/.npmrc

      - name: Install dependencies
        if: ${{ steps.node_modules_cache.outputs.cache-hit != 'true' }}
        run: |
          git config --global credential.helper store
          echo "https://oauth2:${{ secrets.PAT_PRIVATE_DEPS }}@github.com" > ~/.git-credentials
          git config --global url."https://${{ secrets.PAT_PRIVATE_DEPS }}@github.com/".insteadOf "git@github.com:"
          npm ci

      - name: Verify dependencies installed
        run: |
          test -f node_modules/@polestar/constants/countries.js && echo "constants OK"
          test -f node_modules/@polestar/timed-usage/dist/index.js && echo "timed-usage OK"

      - name: Upload node_modules
        uses: actions/upload-artifact@v4
        with:
          name: node_modules
          path: node_modules
          retention-days: 1
