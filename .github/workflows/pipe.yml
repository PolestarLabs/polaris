name: Tests

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  deps:
    name: Dependencies
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Compute lockfile hash
        id: lockhash
        run: |
          node -e "const fs=require('fs');const crypto=require('crypto');const p='package-lock.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));delete j.version;const h=crypto.createHash('sha256').update(JSON.stringify(j)).digest('hex');fs.writeFileSync('.lockhash',h);"
          echo "hash=$(cat .lockhash)" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules
        id: node_modules_cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ runner.os }}-${{ steps.lockhash.outputs.hash }}
          restore-keys: |
            node_modules-${{ runner.os }}-

      - name: Configure npm to skip git dep builds
        run: echo 'ignore-scripts=true' >> ~/.npmrc

      - name: Install dependencies
        if: ${{ steps.node_modules_cache.outputs.cache-hit != 'true' }}
        run: |
          git config --global credential.helper store
          echo "https://oauth2:${{ secrets.PAT_PRIVATE_DEPS }}@github.com" > ~/.git-credentials
          git config --global url."https://${{ secrets.PAT_PRIVATE_DEPS }}@github.com/".insteadOf "git@github.com:"
          npm ci

      - name: Verify dependencies installed
        run: |
          test -f node_modules/@polestar/constants/countries.js && echo "constants OK"
          test -f node_modules/@polestar/timed-usage/dist/index.js && echo "timed-usage OK"

      - name: Upload node_modules
        uses: actions/upload-artifact@v4
        with:
          name: node_modules
          path: node_modules
          retention-days: 1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: deps

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache jest
        uses: actions/cache@v4
        with:
          path: /tmp/jest_rt
          key: jest-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            jest-${{ runner.os }}-

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: node_modules

      - name: Install Jest
        run: npm install --no-save jest

      - name: Build
        run: npm run build

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: deps

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache jest
        uses: actions/cache@v4
        with:
          path: /tmp/jest_rt
          key: jest-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            jest-${{ runner.os }}-

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: node_modules

      - name: Install Jest
        run: npm install --no-save jest

      - name: Run unit tests
        run: npm test -- --forceExit --ci --testPathPatterns "test/(?!integration).*\.test\.js$"

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: deps

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache jest
        uses: actions/cache@v4
        with:
          path: /tmp/jest_rt
          key: jest-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            jest-${{ runner.os }}-

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: node_modules

      - name: Install Jest
        run: npm install --no-save jest

      - name: Run integration tests
        run: npm test -- --forceExit --ci --testPathPatterns "test/integration/.*\.test\.js$"

  version:
    name: ⚛️ Update Canonical Version
    needs: [unit, integration, build, deps]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.unit.result == 'success' && needs.integration.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js environment
        uses: actions/setup-node@v2.4.1
        with:
          node-version: "16.5"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for version change
        id: version_check
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^package.json$'; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Package V
        if: ${{ steps.version_check.outputs.bump == 'true' }}
        run: |
          git config --global user.email "bot@pollux.gg"
          git config --global user.name "Pollux Autoupdate"
          git pull
          npm version patch -m "Autoupgrade to %s"
          git push

  tag:
    name: 🏷️ Tag Release
    needs: version
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      prev_minor: ${{ steps.version.outputs.prev_minor }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$PREV_TAG" ]; then
            PREV_MINOR=$(echo "$PREV_TAG" | sed 's/^v//' | cut -d. -f2)
          else
            PREV_MINOR=0
          fi
          if [ "$MINOR" -gt "$PREV_MINOR" ]; then
            RELEASE=true
          else
            RELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "prev_minor=$PREV_MINOR" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

  release:
    name: 📦 Create Release
    needs: tag
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.tag.result == 'success' && needs.tag.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.tag.outputs.version }}
          name: v${{ needs.tag.outputs.version }}

  deploy:
    name: 🚀 Deploy Release
    needs: release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.tag.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin
            git checkout v${{ needs.release.outputs.version }}
