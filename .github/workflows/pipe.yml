name: Pipe

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps:
    uses: ./.github/workflows/deps.yml
    secrets: inherit

  build:
    needs: deps
    uses: ./.github/workflows/build.yml
    secrets: inherit

  unit:
    needs: deps
    uses: ./.github/workflows/test-unit.yml
    secrets: inherit

  integration:
    needs: deps
    uses: ./.github/workflows/test-integration.yml
    secrets: inherit

  gate:
    needs: [unit, integration, build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.unit.result == 'success' && needs.integration.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "✓ Release gate opened"

  version:
    needs: gate
    uses: ./.github/workflows/version.yml
    secrets: inherit

  tag:
    needs: version
    uses: ./.github/workflows/tag.yml
    secrets: inherit

  release:
    needs: tag
    if: ${{ needs.tag.outputs.release == 'true' }}
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      version: ${{ needs.tag.outputs.version }}

  deploy:
    needs: tag
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      version: ${{ needs.tag.outputs.version }}
