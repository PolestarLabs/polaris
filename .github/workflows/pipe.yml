name: Pipe

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        description: "Target environment for manual run"
        options: [staging, production]
        default: production
  pull_request:
    branches: [dev, master, live]
  push:
    branches: [dev, master, live]

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps:
    name: 📦 Install Dependencies
    uses: ./.github/workflows/deps.yml
    secrets: inherit

  build:
    name: 🔨 Build
    needs: deps
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      lockhash: ${{ needs.deps.outputs.lockhash }}

  unit:
    name: ✅ Unit Tests
    needs: deps
    uses: ./.github/workflows/test-unit.yml
    secrets: inherit
    with:
      lockhash: ${{ needs.deps.outputs.lockhash }}

  integration:
    name: 🔗 Integration Tests
    needs: deps
    uses: ./.github/workflows/test-integration.yml
    secrets: inherit
    with:
      lockhash: ${{ needs.deps.outputs.lockhash }}

  # ── Staging pipeline (dev branch only) ───────────────────────────────────

  staging-gate:
    name: 🚪 Staging Gate
    needs: [unit, integration]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs.unit.result == 'success' &&
      needs.integration.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo "✓ Staging gate opened"

  version:
    name: ⚛️ Update Version
    needs: staging-gate
    uses: ./.github/workflows/version.yml
    secrets: inherit

  tag:
    name: 🏷️ Create Tag
    needs: version
    uses: ./.github/workflows/tag.yml
    secrets: inherit

  release:
    name: 📦 Create Release
    needs: tag
    if: ${{ needs.tag.outputs.release == 'true' }}
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      version: ${{ needs.tag.outputs.version }}

  deploy-staging:
    name: 🧪 Deploy → Staging
    needs: tag
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: staging
      version: ${{ needs.tag.outputs.version }}

  # ── Production pipeline (master branch only) ─────────────────────────────

  production-gate:
    name: 🚪 Production Gate
    needs: [unit, integration]
    # gate opens automatically on a qualifying push, or can be manually
    # triggered via workflow_dispatch using the same logic below.
    if: >
      (
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/live') &&
        (
          (needs.unit.result == 'success' && needs.integration.result == 'success') ||
          contains(github.event.head_commit.message, 'hotfix')
        )
      ) ||
      (github.event_name == 'workflow_dispatch' && github.event.action == 'requested')
    runs-on: ubuntu-latest
    steps:
      - run: echo "✓ Production gate opened"
  deploy-production:
    name: 🚀 Deploy → Production
    needs: production-gate
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: production
