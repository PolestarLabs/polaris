name: Tests

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]

jobs:
  test:
    name: í·ª Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Configure npm to skip git dep builds
        run: echo 'ignore-scripts=true' >> ~/.npmrc

      - name: Install dependencies
        working-directory: ./DEV/bot
        run: npm install --ignore-scripts

      - name: Verify dependencies installed
        working-directory: ./DEV/bot
        run: |
          test -f node_modules/@polestar/constants/countries.js && echo "âœ“ constants OK"
          test -f node_modules/@polestar/timed-usage/dist/index.js && echo "âœ“ timed-usage OK"

      - name: Run tests
        working-directory: ./DEV/bot
        run: npm test -- --forceExit --ci

      - name: Run tests with coverage
        if: matrix.node-version == 20
        working-directory: ./DEV/bot
        run: npm run test:coverage -- --forceExit --ci
