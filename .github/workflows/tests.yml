name: Tests

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]

jobs:
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --ignore-scripts
        # --ignore-scripts skips native module builds (skia-canvas, canvas)
        # that aren't needed for unit tests and fail without system deps

      - name: Run tests
        run: npm test -- --forceExit --ci

      - name: Run tests with coverage
        if: matrix.node-version == 20
        run: npm run test:coverage -- --forceExit --ci
