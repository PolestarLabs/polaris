name: Tests

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Configure git for private dependencies
        env:
          TOKEN: ${{ secrets.PAT_PRIVATE_DEPS }}
        run: |
          echo "machine github.com login x-access-token password ${TOKEN}" > ~/.netrc
          chmod 600 ~/.netrc
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Configure npm to skip git dep builds
        run: echo 'ignore-scripts=true' >> ~/.npmrc

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify dependencies installed
        run: |
          test -f node_modules/@polestar/constants/countries.js && echo "constants OK"
          test -f node_modules/@polestar/timed-usage/dist/index.js && echo "timed-usage OK"

      - name: Run tests
        run: npm test -- --forceExit --ci

      - name: Run tests with coverage
        if: matrix.node-version == 20
        run: npm run test:coverage -- --forceExit --ci
