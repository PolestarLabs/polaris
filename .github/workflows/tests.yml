name: Tests

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]

jobs:
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'DEV/bot/package-lock.json'

      - name: Configure npm to skip git dep builds
        run: |
          echo 'ignore-scripts=true' >> ~/.npmrc
          echo 'script-shell=/bin/bash' >> ~/.npmrc

      - name: Install dependencies (allow git dep errors, they're pre-built)
        run: npm ci --ignore-scripts 2>&1 || true
        # npm ci uses package-lock.json for reproducible installs
        # Git deps like chrono-node have prepare scripts but we're skipping them
        # since the built files should be in git already

      - name: Verify dependencies installed
        run: |
          test -f node_modules/@polestar/constants/countries.js && echo "constants OK"
          test -f node_modules/@polestar/timed-usage/dist/index.js && echo "timed-usage OK"
