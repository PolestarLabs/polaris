name: Restart Bot

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [restart]

# trigger via `gh api repos/:owner/:repo/dispatches -f event_type=restart`

jobs:
  restart:
    name: Restart bot processes
    runs-on: [self-hosted, polestar-bot]
    steps:
      - name: Checkout (for context)
        uses: actions/checkout@v4
      - name: Restart PM2 bot
        run: |
          echo "Restarting bot via PM2"
          pm2 reload reg || pm2 restart prime || echo "bot process may not be running"
