name: Tag

on:
  workflow_call:
    outputs:
      version:
        description: "Version number"
        value: ${{ jobs.create.outputs.version }}
      minor:
        description: "Minor version"
        value: ${{ jobs.create.outputs.minor }}
      prev_minor:
        description: "Previous minor version"
        value: ${{ jobs.create.outputs.prev_minor }}
      release:
        description: "Release flag"
        value: ${{ jobs.create.outputs.release }}
      tag_created:
        description: "Whether tag was created"
        value: ${{ jobs.create.outputs.tag_created }}

jobs:
  create:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      prev_minor: ${{ steps.version.outputs.prev_minor }}
      release: ${{ steps.version.outputs.release }}
      tag_created: ${{ steps.meaningful.outputs.tag_worthy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$PREV_TAG" ]; then
            PREV_MINOR=$(echo "$PREV_TAG" | sed 's/^v//' | cut -d. -f2)
          else
            PREV_MINOR=0
          fi
          if [ "$MINOR" -gt "$PREV_MINOR" ]; then
            RELEASE=true
          else
            RELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "prev_minor=$PREV_MINOR" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Check for meaningful changes
        id: meaningful
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$PREV_TAG" ]; then
            echo "tag_worthy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # Get files changed since last tag
          git diff --name-only $PREV_TAG HEAD > /tmp/changed_files.txt
          
          # Check if package.json changed
          if grep -q '^package.json$' /tmp/changed_files.txt; then
            # Fetch previous package.json and compare excluding the version field
            git show $PREV_TAG:package.json > /tmp/prev_package.json
            NODE_EQ=$(node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/prev_package.json','utf8'));const b=JSON.parse(fs.readFileSync('package.json','utf8'));delete a.version;delete b.version;process.stdout.write(JSON.stringify(a)===JSON.stringify(b))")
            if [ "$NODE_EQ" = "true" ]; then
              # Only version changed — not tag-worthy by itself, continue checking other files
              :
            else
              # package.json changed meaningfully
              echo "tag_worthy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          
          # Check if any non-config files changed
          while IFS= read -r file; do
            # Skip config files
            if [[ "$file" =~ \.(config|y|yml)\.js$ ]] || \
               [[ "$file" =~ ^(config|crowdin|eslintrc|tsconfig|\.gitignore|package-lock) ]] || \
               [[ "$file" == "README.md" ]] || \
               [[ "$file" =~ ^\.github/workflows ]]; then
              continue
            fi
            # Found a meaningful file
            echo "tag_worthy=true" >> "$GITHUB_OUTPUT"
            exit 0
          done < /tmp/changed_files.txt
          
          # Only config files changed
          echo "tag_worthy=false" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: ${{ steps.meaningful.outputs.tag_worthy == 'true' }}
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
