name: Tag

on:
  workflow_call:
    outputs:
      version:
        description: "Version number"
        value: ${{ jobs.create.outputs.version }}
      minor:
        description: "Minor version"
        value: ${{ jobs.create.outputs.minor }}
      prev_minor:
        description: "Previous minor version"
        value: ${{ jobs.create.outputs.prev_minor }}
      release:
        description: "Release flag"
        value: ${{ jobs.create.outputs.release }}
      tag_created:
        description: "Whether tag was created"
        value: ${{ jobs.create.outputs.tag_created }}

jobs:
  create:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      prev_minor: ${{ steps.version.outputs.prev_minor }}
      release: ${{ steps.version.outputs.release }}
      tag_created: ${{ steps.meaningful.outputs.tag_worthy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$PREV_TAG" ]; then
            PREV_MINOR=$(echo "$PREV_TAG" | sed 's/^v//' | cut -d. -f2)
          else
            PREV_MINOR=0
          fi
          if [ "$MINOR" -gt "$PREV_MINOR" ]; then
            RELEASE=true
          else
            RELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "prev_minor=$PREV_MINOR" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Check for meaningful changes
        id: meaningful
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$PREV_TAG" ]; then
            echo "tag_worthy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get files changed since last tag
          git diff --name-only $PREV_TAG HEAD > /tmp/changed_files.txt

          # If package.json changed explicitly, consider it meaningful
          if grep -q '^package.json$' /tmp/changed_files.txt; then
            echo "tag_worthy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Treat the following as trivial changes (do not trigger tags):
          # - workflow files under .github/workflows
          # - common config files: *.yml, *.yaml, *.config.js, tsconfig*, eslintrc*, crowdin*, .gitignore, package-lock.json, README.md
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/*) 
                ;; # trivial
              *.yml|*.yaml)
                ;; # trivial
              *.config.js|*.config.cjs|config/*)
                ;; # trivial
              eslintrc*|tsconfig*|crowdin*|.gitignore|package-lock.json|README.md)
                ;; # trivial
              *)
                # Found a meaningful (non-trivial) file
                echo "tag_worthy=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done < /tmp/changed_files.txt

          # Only trivial/config/workflow files changed
          echo "tag_worthy=false" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: ${{ steps.meaningful.outputs.tag_worthy == 'true' }}
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
