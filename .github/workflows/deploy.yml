name: Deploy

on:
  workflow_call:
    inputs:
      delayed_restart:
        required: false
        type: boolean
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "resolved=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            echo "== DEPLOY BETA =="
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin
            git checkout --force v${{ steps.version.outputs.resolved }}
            echo "== DEPLOY LIVE =="
            cd ${{ secrets.DEPLOY_PATH_DELAYED }}
            git fetch origin
            git checkout --force v${{ steps.version.outputs.resolved }}
      - name: Restart PRIME Instances
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            node -v
            pm2 ls
            pm2 restart prime

      - name: Rolling Restart of REGULAR Instances
        uses: appleboy/ssh-action@v1.0.0
        if: ${{ inputs.delayed_restart == 'true' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            pm2 reload reg

