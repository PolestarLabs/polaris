name: Deploy

on:
  workflow_call:
    inputs:
      delayed_restart:
        required: false
        type: boolean
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "resolved=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            echo "== DEPLOY BETA =="
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin
            git checkout --force v${{ steps.version.outputs.resolved }}
            echo "== DEPLOY LIVE =="
            cd ${{ secrets.DEPLOY_PATH_DELAYED }}
            git fetch origin
            git checkout --force v${{ steps.version.outputs.resolved }}
      - name: Check Node & pm2 on remote
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            bash -lc "echo 'Checking node and pm2 on remote'"
            # try to source common profile files and nvm so node/pm2 installed per-user are available
            bash -lc "[ -f \"$HOME/.nvm/nvm.sh\" ] && . \"$HOME/.nvm/nvm.sh\" || true; [ -f \"$HOME/.profile\" ] && . \"$HOME/.profile\" || true; [ -f \"$HOME/.bash_profile\" ] && . \"$HOME/.bash_profile\" || true; [ -f \"$HOME/.bashrc\" ] && . \"$HOME/.bashrc\" || true"
            bash -lc "cd '${{ secrets.DEPLOY_PATH }}' || true"
            # debug: show PATH and which for node/pm2
            bash -lc "echo 'PATH='\"$PATH\"; which node || true; which pm2 || true"
            bash -lc "if ! command -v node >/dev/null 2>&1; then echo 'ERROR: node not found in PATH for the deploy user.'; echo 'Make Node.js available to the deploy user (system install or nvm).'; exit 1; fi"
            bash -lc "if ! command -v pm2 >/dev/null 2>&1; then echo 'ERROR: pm2 not found in PATH for the deploy user.'; echo 'Install pm2 (npm i -g pm2) or make it available to the deploy user.'; exit 1; fi"
            bash -lc "echo 'node and pm2 detected:' $(node -v) $(pm2 -v || true)"
      - name: Restart PRIME Instances
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            bash -lc "[ -f \"$HOME/.nvm/nvm.sh\" ] && . \"$HOME/.nvm/nvm.sh\" || true; [ -f \"$HOME/.profile\" ] && . \"$HOME/.profile\" || true; [ -f \"$HOME/.bash_profile\" ] && . \"$HOME/.bash_profile\" || true; [ -f \"$HOME/.bashrc\" ] && . \"$HOME/.bashrc\" || true; cd '${{ secrets.DEPLOY_PATH }}' && node -v && pm2 ls && pm2 restart prime"

      - name: Rolling Restart of REGULAR Instances
        uses: appleboy/ssh-action@v1.0.0
        if: ${{ inputs.delayed_restart == 'true' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            bash -lc "[ -f \"$HOME/.nvm/nvm.sh\" ] && . \"$HOME/.nvm/nvm.sh\" || true; [ -f \"$HOME/.profile\" ] && . \"$HOME/.profile\" || true; [ -f \"$HOME/.bash_profile\" ] && . \"$HOME/.bash_profile\" || true; [ -f \"$HOME/.bashrc\" ] && . \"$HOME/.bashrc\" || true; cd '${{ secrets.DEPLOY_PATH }}' && pm2 reload reg"

