name: Deploy (minimal)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target environment (staging/production or their aliases: dev/beta for staging, live for production)"
      version:
        required: false
        type: string
        description: "Optional version identifier"

jobs:
  deploy-staging:
    name: Deploy Staging
    runs-on: [self-hosted, linux]
    if: |
      contains('staging dev beta', inputs.environment)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug inputs
        run: |
          echo "ENVIRONMENT=${{ inputs.environment }} (staging job)"
          echo "VERSION=${{ inputs.version || 'none' }}"

      - name: Run deploy script
        run: |
          /home/pollux/polaris/scripts/server-deploy.sh bot staging ${{ inputs.version }}

      - name: Completed
        run: echo "Staging deployment finished"

  deploy-production:
    name: Deploy Production
    runs-on: [self-hosted, linux]
    if: |
      contains('production live', inputs.environment)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug inputs
        run: |
          echo "ENVIRONMENT=${{ inputs.environment }} (production job)"
          echo "VERSION=${{ inputs.version || 'none' }}"

      - name: Run deploy script
        run: |
          /home/pollux/polaris/scripts/server-deploy.sh bot production ${{ inputs.version }}

      - name: Completed
        run: echo "Production deployment finished"
