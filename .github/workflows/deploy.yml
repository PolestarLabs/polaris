name: Deploy (minimal)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target environment: staging or production"
      version:
        required: false
        type: string
        description: "Optional version identifier"

jobs:
  deploy:
    name: Deploy Bot
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Determine target directory
        id: target
        run: |
          # choose the correct secret based on the environment
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "dir=${{ secrets.DEPLOY_PATH_LIVE }}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=${{ secrets.DEPLOY_PATH }}" >> "$GITHUB_OUTPUT"
          fi
          # debug output: show resolved value (will be masked in logs)
          echo "DEBUG: resolved dir='${{ steps.target.outputs.dir }}'"
      - name: Validate directory
        run: |
          DIR="${{ steps.target.outputs.dir }}"
          if [ -z "$DIR" ] || [ "$DIR" = "***" ]; then
            echo "ERROR: deployment path is empty or unset ($DIR)" >&2
            exit 1
          fi
          echo "Using directory: $DIR"

      - name: Checkout requested version
        run: |
          DIR="${{ steps.target.outputs.dir }}"
          cd "$DIR"
          git fetch origin
          if [ -n "${{ inputs.version }}" ]; then
            git checkout --force "v${{ inputs.version }}"
          else
            git checkout --force origin/$(git rev-parse --abbrev-ref HEAD)
          fi

      - name: Run deploy script
        run: |
          DIR="${{ steps.target.outputs.dir }}"
          cd "$DIR"
          /home/pollux/polaris/scripts/server-deploy.sh bot ${{ inputs.environment }}

      - name: Completed
        run: echo "Deployment to ${{ inputs.environment }} finished"