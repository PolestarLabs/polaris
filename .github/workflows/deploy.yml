name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target environment: staging or production"
      version:
        required: false
        type: string
        description: "Version tag to deploy (e.g. 1.2.3). Defaults to package.json version."
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        description: "Target environment"
        options: [staging, production]
        default: staging

jobs:
  ssh:
    name: 🚀 SSH Deploy (${{ inputs.environment }})
    # execute deploy steps on our local self-hosted runner rather than
    # the hosted `ubuntu-latest` pool
    runs-on: [self-hosted, linux]
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "resolved=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "resolved=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy locally
        if: ${{ inputs.environment == 'staging' }}
        run: |
          set -e
          echo "=== DEPLOY BOT (staging) · v${{ steps.version.outputs.resolved }} ==="
          DIR="${{ secrets.DEPLOY_PATH }}"
          if [ -z "$DIR" ] || [ "$DIR" = "***" ]; then
            echo "ERROR: DEPLOY_PATH secret is not set or empty ($DIR)" >&2
            exit 1
          fi
          cd "$DIR"
          git fetch origin
          git checkout --force "v${{ steps.version.outputs.resolved }}"
          /home/pollux/polaris/scripts/server-deploy.sh bot staging
          echo "=== Done ==="
      - name: Deploy locally
        if: ${{ inputs.environment == 'production' }}
        run: |
          set -e
          echo "=== DEPLOY BOT (production) · v${{ steps.version.outputs.resolved }} ==="
          DIR="${{ secrets.DEPLOY_PATH_LIVE }}"
          if [ -z "$DIR" ] || [ "$DIR" = "***" ]; then
            echo "ERROR: DEPLOY_PATH_LIVE secret is not set or empty ($DIR)" >&2
            exit 1
          fi
          cd "$DIR"
          git fetch origin
          git checkout --force "v${{ steps.version.outputs.resolved }}"
          /home/pollux/polaris/scripts/server-deploy.sh bot production
          echo "=== Done ==="