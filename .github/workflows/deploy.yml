name: Deploy (minimal)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target environment (staging/production or their aliases: dev/beta for staging, live for production)"
      version:
        required: false
        type: string
        description: "Optional version identifier"

jobs:
  deploy:
    name: Deploy Bot
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug inputs
        run: |
          echo "ENVIRONMENT=${{ inputs.environment }}"
          echo "VERSION=${{ inputs.version || 'none' }}"


      - name: Compute canonical environment
        id: canon
        run: |
          env="${{ inputs.environment }}"
          case "$env" in
            dev|beta) env=staging ;; 
            live) env=production ;;
          esac
          echo "canonical=$env" >> "$GITHUB_OUTPUT"
          echo "DEBUG: canonical environment is $env"

      - name: Run deploy script
        run: |
          /home/pollux/polaris/scripts/server-deploy.sh bot ${{ steps.canon.outputs.canonical }} ${{ inputs.version }}

      - name: Completed
        run: echo "Deployment to ${{ inputs.environment }} finished"